name: DSD 与回归验证

on:
  pull_request:
  workflow_dispatch:
  # 打包工作流复用相同检查，确保当前提交先通过验证再生成安装包。
  workflow_call:

permissions:
  contents: read

# 与调用方的 build-* 组区分，避免可复用工作流取消正在等待它的打包任务。
concurrency:
  group: dsd-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 下载并校验固定版本 FFmpeg 与 ffprobe
        id: ffmpeg
        run: |
          # Ubuntu 24.04 的 FFmpeg 6.1 不支持上游已使用的 reset_sar / WebP ID3 封面。
          # 使用 FFmpeg 官网链接的 BtbN 预编译月末版，固定资产与 SHA-256，不现场编译。
          ffmpeg_archive="$RUNNER_TEMP/ffgui-ffmpeg-linux.tar.xz"
          ffmpeg_tools="$RUNNER_TEMP/ffgui-ffmpeg"
          curl --fail --show-error --location --retry 3 \
            --output "$ffmpeg_archive" \
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz'
          printf '68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269  %s\n' "$ffmpeg_archive" | sha256sum --check --strict
          mkdir -p "$ffmpeg_tools"
          tar -xJf "$ffmpeg_archive" -C "$ffmpeg_tools" --strip-components=1
          test -x "$ffmpeg_tools/bin/ffmpeg"
          test -x "$ffmpeg_tools/bin/ffprobe"
          printf 'FFMPEG=%s\nFFPROBE=%s\n' "$ffmpeg_tools/bin/ffmpeg" "$ffmpeg_tools/bin/ffprobe" >> "$GITHUB_ENV"
          node --version > tool-versions.log
          "$ffmpeg_tools/bin/ffmpeg" -version >> tool-versions.log
          "$ffmpeg_tools/bin/ffprobe" -version >> tool-versions.log
          cat tool-versions.log

      # 所有测试使用 Node 内置运行器；无需为验证下载 Electron 或编译 Rust。
      - name: 音视频功能回归（真实 FFmpeg）
        if: ${{ !cancelled() && steps.ffmpeg.outcome == 'success' }}
        run: npm run test:regression 2>&1 | tee regression.log

      - name: 光盘任务、侧车协议与页面回归
        if: ${{ !cancelled() && steps.ffmpeg.outcome == 'success' }}
        run: npm run test:disc 2>&1 | tee disc.log

      - name: DSD 文件头、转换与页面回归（真实 FFmpeg）
        if: ${{ !cancelled() && steps.ffmpeg.outcome == 'success' }}
        run: npm run test:dsd 2>&1 | tee dsd.log

      - name: 保存验证日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsd-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tool-versions.log
            regression.log
            disc.log
            dsd.log
          if-no-files-found: warn
          retention-days: 14
